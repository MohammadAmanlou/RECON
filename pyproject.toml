[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-omega"
version = "0.1.0"
description = "Calibrated synthetic pilot for interventional competence hypergraph identification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
neural = ["torch>=2.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]